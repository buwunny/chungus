[package]
name = "chungus"
version = "0.1.0"
description = "Chunk, compress and deduplicate AI model files"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
fastcdc = "5.0.0"
memmap2 = "0.9.11"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zstd = "0.14.0"
