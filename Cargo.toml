[package]
name = "chungus"
version = "0.1.0"
description = "Chunk, compress and deduplicate AI model files"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
fastcdc = "5.0.0"
futures = "0.3.34"
getrandom = "0.4.3"
libp2p = { version = "0.57", features = ["tokio", "tcp", "quic", "noise", "yamux", "kad", "identify", "request-response", "cbor", "macros", "relay", "dcutr", "autonat", "ping", "dns"] }
mdns-sd = "0.21.4"
memmap2 = "0.9.11"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync", "io-util", "signal"] }
zstd = "0.14.0"

[dev-dependencies]
tempfile = "3.27.0"

# Lazy mounting. Linux only for now: on macOS fuser has to link against macFUSE's
# libfuse, which every user would then need installed just to run chungus.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18.0", default-features = false }
libc = "0.2"
