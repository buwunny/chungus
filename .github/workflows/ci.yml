name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older runs; main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Only main saves a cache; pull requests reuse it, so each branch doesn't
      # add its own copy to the repository's 10 GB cache.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # For the mount test.
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  # Short fuzzing runs of every parser that reads data from other machines.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The prebuilt cargo-fuzz is a musl binary and would default to that target, which
      # can't use the address sanitizer, so name the runner's own target.
      - name: Fuzz each target for a minute
        run: |
          for t in $(cargo fuzz list); do
            cargo fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=60 -rss_limit_mb=2048
          done

  # Release binaries include macOS, so make sure it still builds there.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Only main saves a cache; pull requests reuse it, so each branch doesn't
      # add its own copy to the repository's 10 GB cache.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --locked -- -D warnings
