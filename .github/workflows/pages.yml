# Publishes site/ (the landing page and model search) to GitHub Pages. To use it, set
# Settings > Pages > Source to "GitHub Actions" and tick "Enforce HTTPS", and set the
# repository variable CHUNGUS_REGISTRY_URL to the public registry (https:// only). The
# pages then read the live registry, with a snapshot of its index, refreshed every six
# hours, as a fallback.
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.CHUNGUS_REGISTRY_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the site at the registry and snapshot its index
        env:
          REGISTRY: ${{ vars.CHUNGUS_REGISTRY_URL }}
        run: |
          REGISTRY="${REGISTRY%/}"
          case "$REGISTRY" in
            https://*) ;;
            *) echo "::error::CHUNGUS_REGISTRY_URL must start with https://"; exit 1 ;;
          esac
          printf 'window.CHUNGUS = { registry: %s };\n' "$(jq -Rn --arg r "$REGISTRY" '$r')" > site/config.js
          curl -fsS --proto =https "$REGISTRY/v1/index" -o site/index.json
          jq -e 'type == "array"' site/index.json > /dev/null
          curl -fsS --proto =https "$REGISTRY/v1/head" -o site/head.json
      - id: pages
        uses: actions/configure-pages@v5
      # Link previews need an absolute image URL, and the 404 page is served at any
      # missing path, so both need to know where the site lives.
      - name: Point link previews and the 404 page at the site's address
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          sed -i "s|content=\"og.png\"|content=\"${BASE_URL%/}/og.png\"|" site/index.html site/search.html
          sed -i "s|<base href=\"/\">|<base href=\"${BASE_PATH%/}/\">|" site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
