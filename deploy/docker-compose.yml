# A public chungus node: a bootstrap and anchor for the swarm, and a relay for peers
# behind NAT. From this directory:
#   cp node.env.example node.env   # then edit it
#   docker compose up -d
#   docker compose logs node       # shows the peer id and addresses to share
#
# The image is the one CI publishes from main (linux/amd64 and arm64). To upgrade:
#   docker compose pull && docker compose up -d
# Set CHUNGUS_IMAGE in .env to pin a version (ghcr.io/buwunny/chungus:0.2.0, say), or run
# `docker compose up -d --build` to build from this checkout instead.
#
# The registry and its search site are a separate profile, served over HTTPS by Caddy:
#   cp .env.example .env           # set CHUNGUS_DOMAIN
#   docker compose --profile registry up -d
#   docker compose logs registry   # shows the operator key; back up the registry-data volume
services:
  node:
    build: ..
    image: ${CHUNGUS_IMAGE:-ghcr.io/buwunny/chungus:latest}
    env_file: node.env
    restart: unless-stopped
    init: true
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
    volumes:
      - chungus-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Model names, the signed log and the blocklist. Only Caddy can reach it.
  registry:
    profiles: [registry]
    image: ${CHUNGUS_IMAGE:-ghcr.io/buwunny/chungus:latest}
    build: ..
    entrypoint: ["chungus", "registry"]
    environment:
      CHUNGUS_REGISTRY_DATA: /data/registry
      # Only Caddy reaches the registry, and it sets X-Forwarded-For to the client's
      # address, which download counts go by.
      CHUNGUS_BEHIND_PROXY: "true"
    restart: unless-stopped
    init: true
    expose:
      - "7450"
    volumes:
      - registry-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # HTTPS for the registry API and the site (landing page and search) from ../site.
  web:
    profiles: [registry]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [registry]
    environment:
      CHUNGUS_DOMAIN: ${CHUNGUS_DOMAIN:-localhost}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  chungus-data:
  registry-data:
  caddy-data:
  caddy-config:
