# A public chungus node: a bootstrap and anchor for the swarm, and a relay for peers
# behind NAT. From this directory:
#   cp node.env.example node.env   # then edit it
#   docker compose up -d --build
#   docker compose logs node       # shows the peer id and addresses to share
services:
  node:
    build: ..
    image: chungus
    env_file: node.env
    restart: unless-stopped
    init: true
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
    volumes:
      - chungus-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  chungus-data:
